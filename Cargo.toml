[package]
name = "mynet"
version = "0.1.0"
edition = "2021"
authors = ["laguser"]
description = "Fastfetch-styled minimal network auditor and local LAN device topology discoverer"
readme = "README.md"
license = "MIT"
repository = "https://github.com/laguser/mynet"
homepage = "https://github.com/laguser/mynet"
keywords = ["network", "fastfetch", "discovery", "arp", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "mynet"
path = "src/main.rs"

[[bin]]
name = "myip"
path = "src/bin/myip.rs"

[dependencies]
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
pnet_datalink = "0.34"
ipnetwork = "0.20"
dns-lookup = "2.0"
